[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal_insight_engine"
version = "0.1.0"
description = "Advanced portfolio project implementing transformer-based models from scratch with Constitutional AI safety principles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Arthur Passuello"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime dependencies
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.5.0",
    "transformers>=4.30.0",
    "fastapi>=0.115.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.20.0",
    "starlette>=0.38.0",
    "numpy>=1.26.0,<2.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "tensorboard>=2.14.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Image processing and visualization
    "matplotlib>=3.0.0",
    "seaborn>=0.12.0",
    "opencv-python>=4.0.0",
    "pillow>=10.0.0",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.0.0",
    # NLP utilities
    "nltk>=3.8.0",
    # CLIP model support
    "open-clip-torch>=2.26.0",
    # Demo interface
    "gradio>=4.0.0",
    # Note: torchvision installed separately in CI from CPU index
]

[project.urls]
Homepage = "https://github.com/apassuello/multimodal_insight_engine"
Repository = "https://github.com/apassuello/multimodal_insight_engine"

# ==============================================================================
# Ruff - Modern Python Linter (Replaces flake8, pylint, isort, and more)
# ==============================================================================
[tool.ruff]
# Target Python 3.10+ for compatibility
target-version = "py310"

# Line length matches Black
line-length = 100

# Directories to exclude
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "docs/_build",
]

[tool.ruff.lint]
# Enable multiple rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (undefined names, unused imports, etc.) - CRITICAL: catches bugs like undefined logger
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modernize Python code)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    # NOTE: PTH (pathlib) rules disabled - too opinionated for portfolio project
    # os.path works fine; focus on catching real bugs (F821, etc.)
]

# Rules to ignore
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module import not at top (intentional lazy imports for optional dependencies)
    "E741",   # Ambiguous variable name (l, O, I - common in ML code)
    "B007",   # Unused loop control variable (common in ML training loops)
    "B008",   # Do not perform function call in argument defaults
    "B904",   # raise-without-from-inside-except (not always applicable)
    "B017",   # assert-raises-exception (pytest pattern)
    "B027",   # empty-method-without-abstract-decorator (intentional abstract patterns)
    "C901",   # Too complex (we have complex ML code)
    "E203",   # Whitespace before ':' (conflicts with Black)
    "N803",   # Invalid argument name (ML papers use single-letter args: x, y, z)
    "N806",   # Non-lowercase variable in function (ML constants: T_max, learning_rate)
    "N812",   # Lowercase imported as non-lowercase (common pattern: import transforms as T)
    "SIM102", # Use single if instead of nested (subjective preference)
    "SIM105", # Use contextlib.suppress instead of try-except-pass (not always clearer)
    "SIM113", # Use enumerate instead of manual counter (sometimes manual is clearer)
    "SIM117", # Use single with statement (subjective preference)
    "SIM108", # Use ternary operator (not always clearer)
    "UP006",  # Use `list` instead of `List` for type annotations
    "UP007",  # Use `X | Y` for type annotations
    "UP035",  # typing.Dict/List/Tuple → dict/list/tuple (postpone modernization)
    "UP038",  # Use `X | Y` in isinstance instead of `(X, Y)` (postpone modernization)
    "TCH003", # Move stdlib imports into TYPE_CHECKING block (postpone optimization)
]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Unused imports, import *
"tests/*" = ["F401", "F811", "F841", "N806"]  # Unused imports, redefined fixtures, unused vars, non-lowercase vars

# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

# ==============================================================================
# Black - Code Formatter
# ==============================================================================
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

# ==============================================================================
# MyPy - Static Type Checker
# ==============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

# Exclude directories
exclude = [
    "venv/",
    ".venv/",
    "build/",
    "dist/",
]

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "datasets.*",
    "gradio.*",
]
ignore_missing_imports = true

# ==============================================================================
# Pytest - Testing Framework
# ==============================================================================
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage settings
addopts = [
    "--verbose",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-branch",
    # Fail if coverage drops below current level (45%)
    "--cov-fail-under=45",
]

# Markers for test organization
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, multiple components)",
    "e2e: End-to-end tests (slowest, full system)",
    "slow: Tests that take significant time to run",
    "requires_gpu: Tests requiring GPU/CUDA",
    "requires_model: Tests requiring trained models",
]

# Test discovery patterns
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==============================================================================
# Coverage.py - Code Coverage
# ==============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ==============================================================================
# isort - Import Sorting (backup to Ruff)
# ==============================================================================
[tool.isort]
profile = "black"
line_length = 100
lines_after_imports = 2  # Match Ruff's lines-after-imports setting
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
